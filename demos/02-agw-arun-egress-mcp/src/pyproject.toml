[project]
name = "agent-finops-egress-mcp"
version = "0.1.0"
description = "Agente ADK FinOps com governança de saída via Agent Gateway (AGENT_TO_ANYWHERE), Agent Registry e IAP CEL MCP"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform[adk,agent_engines]>=1.80.0",
    "mcp>=1.26.0,<2.0.0",
    "google-auth>=2.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cloudpickle>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
